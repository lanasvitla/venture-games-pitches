<!DOCTYPE html>
<html lang="en">
<head>

<title>Venture Games — One-Page Pitches</title>
<style>

<main>

  <table>

      <td class="t"><a href="https://lanasvitla.github.io/venture-games-pitch/">Laura</a></td>
      <td class="d">Bear and ballerina cross drifting ice together: a two-hero cognitive puzzle in ink style. Playable browser prototype.</td>
